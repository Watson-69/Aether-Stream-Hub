<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether Stream Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      /* CSS-only fallback: auto-hides after 10s if JavaScript fails to load or execute */
      @keyframes initialPreloaderFallback {
        0%, 96% {
          opacity: 1;
          visibility: visible;
          pointer-events: auto;
        }
        100% {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }

      @keyframes initialSpinnerRotate {
        to {
          transform: rotate(360deg);
        }
      }

      #initial-page-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #FFF8EC;
        color: #1E1E2E;
        font-family: 'Space Grotesk', Inter, system-ui, -apple-system, sans-serif;
        animation: initialPreloaderFallback 0.3s ease 10s forwards;
      }

      .initial-preloader-spinner {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(192, 57, 43, 0.2);
        border-top-color: #C0392B;
        border-radius: 50%;
        animation: initialSpinnerRotate 1.2s linear infinite;
        margin-top: 16px;
      }

      @media (prefers-reduced-motion: reduce) {
        .initial-preloader-spinner {
          animation: none !important;
          border-color: #C0392B !important;
        }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    </style>
  </head>
  <body>
    <!-- Instant Fallback Preloader (renders before JS bundle executes; auto-dismisses via CSS at 10s if JS fails) -->
    <div id="initial-page-preloader" role="status" aria-live="polite">
      <span class="sr-only">Loading content</span>
      <div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
          <span style="width: 10px; height: 10px; border-radius: 50%; background-color: #C0392B;"></span>
          <span style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: #8C7A6B; font-weight: 600; font-family: monospace;">Aether // Stream</span>
        </div>
        <h1 style="font-size: 26px; font-weight: 800; margin: 0; color: #1E1E2E; letter-spacing: -0.02em;">Aether Stream Hub</h1>
        <div class="initial-preloader-spinner" aria-hidden="true"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
